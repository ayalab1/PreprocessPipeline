name: Windows tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows basic checks
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        # Match the NumPy baseline in environment.windows.yml.
        run: python -m pip install ".[dev]" "numpy==1.26.4"
      - name: Run selected regressions
        timeout-minutes: 5
        run: |
          $ciTempParent = [System.IO.Path]::GetFullPath([System.IO.Path]::GetTempPath()).TrimEnd('\')
          $ciTestRoot = Join-Path $ciTempParent ('pp-ci-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          $ciResolvedRoot = [System.IO.Path]::GetFullPath($ciTestRoot)
          if (-not $ciResolvedRoot.StartsWith($ciTempParent + '\', [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Test temporary directory is outside the OS temporary directory.'
          }
          New-Item -ItemType Directory -Path $ciResolvedRoot -ErrorAction Stop | Out-Null
          $ciOldNumbaCache = $env:NUMBA_CACHE_DIR
          $ciTestExit = 1
          try {
              $env:NUMBA_CACHE_DIR = Join-Path $ciResolvedRoot 'n'
              $ciTests = @(
                  'tests/cli',
                  'tests/setup',
                  'tests/preprocess/test_intan_validation.py',
                  'tests/preprocess/test_disk_space.py',
                  'tests/execution/test_input_identity.py',
                  'tests/gui/test_gui_move_outputs.py::test_move_rewrites_recovery_paths_and_copies_custom_destination_metadata',
                  'tests/gui/test_gui_move_outputs.py::test_move_failure_keeps_source_and_destination_unchanged',
                  'tests/gui/test_gui_move_outputs.py::test_move_rejects_equal_size_staging_corruption_before_source_deletion'
              )
              python -m pytest @ciTests -q -p no:cacheprovider --basetemp (Join-Path $ciResolvedRoot 'p') --durations=5
              $ciTestExit = $LASTEXITCODE
          } finally {
              $env:NUMBA_CACHE_DIR = $ciOldNumbaCache
              Remove-Item -LiteralPath $ciResolvedRoot -Recurse -Force
          }
          exit $ciTestExit
